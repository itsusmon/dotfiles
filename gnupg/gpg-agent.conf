# ~/.gnupg/gpg-agent.conf - GnuPG agent settings.

# Use the macOS GUI passphrase prompt.
pinentry-program /opt/homebrew/bin/pinentry-mac

# Require Pinentry and prevent external password caches.
no-allow-loopback-pinentry
no-allow-external-cache

# Do not reuse a cached passphrase for signing.
ignore-cache-for-signing
default-cache-ttl 300
max-cache-ttl 900

# This setup is software-only and does not use smart cards.
disable-scdaemon
